; island Totem firmware (issue #158, ADR-0015).
; Board build: `pio run -e totem_c6`. Local check: `pio test -e native`.

[platformio]
; `pio run` / `pio test` without `-e` must never reach for the board.
default_envs = totem_c6

[env:totem_c6]
; Arduino on the ESP32-C6 comes from the community pioarduino platform (the
; official platform has none, platform-espressif32 #1694). Pinned release.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs
monitor_speed = 115200
; Unit tests run natively only (`pio test -e native`).
test_ignore = *
build_flags =
    ; Both are required for `Serial` over the native USB-Serial-JTAG.
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    ; LVGL without lv_conf.h, sized for a board without PSRAM.
    -DLV_CONF_SKIP
    -DLV_COLOR_DEPTH=16
    -DLV_USE_SNAPSHOT=0
    -DLV_FONT_MONTSERRAT_20=1
    -DLV_FONT_MONTSERRAT_28=1
    ; The exported Sprites (scripts/export_totem_sprites.py), read by lib/totem_core too.
    -I${PROJECT_DIR}/src/generated
; Exact versions (a caret drifts); pinned from the first green build.
lib_deps =
    moononournation/GFX Library for Arduino@1.6.7
    lewisxhe/XPowersLib@0.3.3
    lvgl/lvgl@9.5.0
    bblanchon/ArduinoJson@7.4.3

[env:native]
platform = native
test_framework = unity
build_flags =
    ; Apple clang breaks the build without an explicit standard.
    -std=gnu++17
    ; The shared contract fixtures, read in place (never copied into test/).
    -DTOTEM_CONTRACT_DIR=\"${PROJECT_DIR}/contract\"
    ; The exported Sprites (scripts/export_totem_sprites.py), read by lib/totem_core.
    -I${PROJECT_DIR}/src/generated
; Pure logic only: `lib/totem_core` needs nothing but ArduinoJson (and the
; generated Sprites header above).
lib_deps =
    bblanchon/ArduinoJson@7.4.3
